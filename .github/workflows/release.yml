name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Match tag and package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("Cargo.toml").read_text(encoding="utf-8")
          package = re.search(r"(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)", manifest)
          if package is None:
              raise SystemExit("Cargo.toml has no package section")
          version = re.search(r'^version\s*=\s*"([^"]+)"', package.group(1), re.MULTILINE)
          if version is None:
              raise SystemExit("Cargo.toml has no package version")
          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH")
          if tag != f"v{version.group(1)}":
              raise SystemExit("Release tag does not match Cargo.toml")
          print(f"Validated {tag}")
          PY

  validate:
    name: Release validation
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Binary / ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tift-target
        run: cargo +1.99.1 build --release --locked --target ${{ matrix.target }}
      - name: Verify binary and package archive
        id: package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          target = os.environ["RELEASE_TARGET"]
          windows = target.endswith("windows-msvc")
          binary_name = "tift.exe" if windows else "tift"
          temp = Path(os.environ["RUNNER_TEMP"])
          binary = temp / "tift-target" / target / "release" / binary_name
          result = subprocess.run([str(binary), "--version"], check=True, capture_output=True, text=True)
          if result.stdout.strip() != f"tift {tag[1:]}":
              raise SystemExit("Built binary version does not match the release tag")
          root = temp / "tift-dist"
          package_name = f"tift-{tag}-{target}"
          package = root / package_name
          package.mkdir(parents=True)
          shutil.copy2(binary, package / binary_name)
          shutil.copy2("LICENSE", package / "LICENSE")
          shutil.copy2("README.md", package / "README.md")
          shutil.copy2("examples/tift.toml", package / "tift.toml")
          archive_format = "zip" if windows else "gztar"
          archive = shutil.make_archive(str(root / package_name), archive_format, root_dir=root, base_dir=package_name)
          expected = {f"{package_name}/{name}" for name in (binary_name, "LICENSE", "README.md", "tift.toml")}
          if windows:
              with zipfile.ZipFile(archive) as packed:
                  actual = {entry.filename for entry in packed.infolist() if not entry.is_dir()}
          else:
              with tarfile.open(archive) as packed:
                  actual = {entry.name for entry in packed.getmembers() if entry.isfile()}
          if actual != expected:
              raise SystemExit("Unexpected files in release archive")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"archive={archive}", file=output)
          print(f"Verified {result.stdout.strip()}; packaged {Path(archive).name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/tift-dist
          merge-multiple: true
      - name: Generate asset checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          targets = {
              "x86_64-unknown-linux-gnu": ".tar.gz",
              "x86_64-pc-windows-msvc": ".zip",
              "aarch64-apple-darwin": ".tar.gz",
              "x86_64-apple-darwin": ".tar.gz",
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "tift-dist"
          expected = {f"tift-{tag}-{target}{extension}" for target, extension in targets.items()}
          actual = {path.name for path in root.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected release asset set: {sorted(actual)}")
          lines = []
          for name in sorted(expected):
              if (root / name).is_symlink() or not (root / name).is_file():
                  raise SystemExit(f"Expected a regular platform archive: {name}")
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          (root / "SHA256SUMS").write_text("".join(lines), encoding="utf-8", newline="\n")
          print(f"Checksummed {len(lines)} platform archives")
          PY
      - name: Create or update the official release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="tift ${tag#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          python - "$tag" "$notes" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag, destination = sys.argv[1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.escape(f"## {tag.removeprefix('v')}")
          section = re.search(rf"^{heading}[ \t]*\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if not section or not section[1].strip():
              raise SystemExit(f"No changelog entry for {tag}")
          Path(destination).write_text(section[1].strip() + "\n", encoding="utf-8")
          PY
          assets=("$RUNNER_TEMP"/tift-dist/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes" --draft=false --prerelease=false --latest
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "$title" --notes-file "$notes" --latest
          fi
