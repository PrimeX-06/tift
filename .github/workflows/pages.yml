name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "site/index.html"
      - "site/homepage.css"
      - "site/homepage.js"
      - "site/branding/tift-logo.svg"
      - "site/branding/tift-latex-formatting.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Playground formatter
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tift-target
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo rustc --locked --lib --profile playground \
            --target wasm32-unknown-unknown --crate-type cdylib
          bindgen_package=$(cargo pkgid --locked wasm-bindgen)
          cargo install wasm-bindgen-cli --locked --bin wasm-bindgen \
            --version "=${bindgen_package##*@}" --root "$RUNNER_TEMP/wasm-bindgen"
          "$RUNNER_TEMP/wasm-bindgen/bin/wasm-bindgen" \
            --target web --no-typescript --out-name tift_playground \
            --out-dir "$RUNNER_TEMP/tift-wasm" \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/playground/tift.wasm"
      - name: Assemble homepage
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/tift-homepage"
          test ! -L site
          test ! -L site/branding
          for file in index.html homepage.css homepage.js \
              branding/tift-logo.svg branding/tift-latex-formatting.png; do
            test -f "site/$file"
            test ! -L "site/$file"
            install -D -m 0644 "site/$file" "$output/$file"
          done
          for file in tift_playground.js tift_playground_bg.wasm; do
            install -D -m 0644 "$RUNNER_TEMP/tift-wasm/$file" "$output/$file"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/tift-homepage

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
