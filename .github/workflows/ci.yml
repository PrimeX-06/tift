name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check public file list
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          allowed = {
              ".gitignore", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md",
              "rust-toolchain.toml", ".github/workflows/ci.yml",
              ".github/workflows/release.yml", "examples/conform.lua",
              "examples/latex-workshop.json", "examples/pre-commit-config.yaml",
              "examples/print_config.rs", "examples/tift.toml",
              "scripts/verify_texlive.py",
              "reports/latex-corpus-test-report.md",
              "reports/texlive-2026-bib-audit/texlive-bib-audit.json",
              "reports/texlive-2026-bib-audit/texlive-bib-audit.md",
              "tests/packages/document_layout_additions.rs",
              "tests/packages/expl3_call_stability.rs",
              "tests/packages/graphics_package_additions.rs",
              "tests/packages/package_scientific_additions.rs",
              "tests/packages/reference_additions.rs",
              "tests/packages/required_package_support.rs",
              "tests/packages/table_extension_additions.rs",
          }
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in filter(None, files):
              source = name.startswith("src/") and name.endswith(".rs")
              if name not in allowed and not source:
                  raise SystemExit("A file outside the public source list is tracked")
              if source:
                  text = Path(name).read_text(encoding="utf-8")
                  if re.search(r"#\s*\[\s*(?:test\b|cfg\s*\(\s*test\b)", text):
                      raise SystemExit("Private test code is present in a public source file")
          PY
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Check Cargo package contents
        shell: bash
        run: |
          cargo +stable package --list --locked > "$RUNNER_TEMP/package-files.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          allowed = {"Cargo.toml", "Cargo.toml.orig", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", ".cargo_vcs_info.json"}
          for name in (Path(os.environ["RUNNER_TEMP"]) / "package-files.txt").read_text().splitlines():
              name = name.replace("\\", "/")
              if name not in allowed and not (name.startswith("src/") and name.endswith(".rs")):
                  raise SystemExit("A file outside the package source list would be published")
          PY
      - name: Release build
        run: cargo +stable build --release --locked
      - name: API documentation
        run: cargo +stable doc --no-deps --locked

  msrv:
    name: Minimum Rust / 1.99.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.99.1 clippy --all-targets --all-features --locked -- -D warnings
      - name: Release build
        run: cargo +1.99.1 build --release --locked
