name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tree:
    name: Public file list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public file list
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          allowed = {
              ".gitignore", "Cargo.toml", "Cargo.lock", "LICENSE",
              "README.md", "CHANGELOG.md", "rust-toolchain.toml",
              ".github/workflows/ci.yml", ".github/workflows/release.yml",
              ".github/workflows/pages.yml", "examples/tift.toml",
              "site/index.html", "site/homepage.css", "site/homepage.js",
              "performance/authored_works.py",
              "site/branding/tift-bibtex-formatting.png", "site/branding/tift-latex-formatting.png",
              "site/branding/tift-logo.svg", "site/branding/tift-logo.tex",
          }
          entries = subprocess.check_output(["git", "ls-files", "--stage", "-z"]).decode().split("\0")
          for entry in filter(None, entries):
              metadata, name = entry.split("\t", 1)
              if metadata.split()[0] not in {"100644", "100755"}:
                  raise SystemExit(f"Expected a regular public file: {name}")
              source = name.startswith("src/") and name.endswith(".rs")
              if name not in allowed and not source:
                  raise SystemExit(f"A non-public file is tracked: {name}")
              if source:
                  text = Path(name).read_text(encoding="utf-8")
                  if re.search(r"#\s*\[\s*(?:test\b|cfg\s*\(\s*test\b)", text):
                      raise SystemExit(f"Private test code is present in {name}")
          PY

  rust:
    name: Rust / ${{ matrix.os }}
    needs: public-tree
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Check Cargo package contents
        shell: bash
        run: |
          cargo +stable package --list --locked > "$RUNNER_TEMP/package-files.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          allowed = {"Cargo.toml", "Cargo.toml.orig", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", ".cargo_vcs_info.json"}
          for name in (Path(os.environ["RUNNER_TEMP"]) / "package-files.txt").read_text().splitlines():
              name = name.replace("\\", "/")
              if name not in allowed and not (name.startswith("src/") and name.endswith(".rs")):
                  raise SystemExit("A file outside the package source list would be published")
          PY
      - name: Release build
        run: cargo +stable build --release --locked
      - name: API documentation
        run: cargo +stable doc --no-deps --locked

  msrv:
    name: Minimum Rust / 1.99.1
    needs: public-tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.99.1 clippy --all-targets --all-features --locked -- -D warnings
      - name: Release build
        run: cargo +1.99.1 build --release --locked
