# Enable only the layout changes appropriate for your project.
[indent]
style = "spaces"
width = 4
preamble = false
beamer-columns = true # Indent the body of a standalone column command in Beamer columns.
pgfplots-panels = true # Indent each panel after a standalone \nextgroupplot.
bibliography-items = true # Indent existing text lines after a standalone \bibitem.
beamer-overprint = true # Indent overlay declarations inside overprint.
algpseudocode = true # Indent matched control flow inside algorithmic environments.
maximum = 40

[indent.rules.document]
additional = false

[indent.rules.item]
width = 4

[indent.rules.quote]
additional = true

[indent.categories.loop]
width = 4 # Each recognized \foreach loop contributes one level.

# Default alignment includes package table/math environments and TikZ \matrix.
# Complete headers and column templates stay separate from measured cells.
[alignment]
enabled = true
width = "display" # Measure Unicode display columns. "graphemes" counts grapheme clusters.
spaces-before = 1
spaces-after = 1
align-row-breaks = true
tikzcd-arrows = false # Give multiple outgoing arrows of a diagram node separate source lines.
align-decimals = true # Align the mantissas in S and D columns, including 1.2(3) and -4.56e-7.
align-equation-labels = true # Align trailing \label commands in multi-equation displays within wrap.columns.
align-by-section = false # Measure columns independently across midrule and longtable section markers.
# row-wrap-columns = 88 # Fold wide table rows at outer cell boundaries. Zero disables it per environment.
# The default row regex also recognizes \tabularnewline and its modifiers.
align-last-row-break = true
align-content-after-row-break = false
format-children = true
multicolumn = true
column-spec = "preserve" # "expand" puts each literal column on its own line; "auto" uses wrap.columns.
short-rows = "align"
justification = "columns" # Follow recognized l/c/r specifications; "left" uses uniform left alignment.
regex-engine = "enhanced"
backtrack-limit = 1000000

[alignment.rules.tabular]
justification = "columns" # Override this to "left", "right", or "center" for uniform alignment.
dont-measure = ['\\phantom\{[^}]*\}']

[alignment.rules.align]
spaces-before = 1
spaces-after = 1

# Disable selected default alignment rules:
# [alignment.rules.matrix]
# enabled = false
# [alignment.rules.'tabular*']
# enabled = false

[wrap]
align-description = false # Align description bodies and hanging lines. Long labels get their own line.
mode = "preserve" # "wrap" folds long lines; "rewrap" joins then folds; "unwrap" joins prose.
# "stable" carries overflow onto the next prose line, preserving later line breaks.
columns = 88
prefer-sentence-ends = true # On overflow, prefer a nearby sentence end, then a Chinese comma, semicolon, or colon.
keep-reference-names = true # Keep Figure, Fig., Table, etc. with a following literal \ref.
keep-number-units = true # Keep plain quantities such as 250 ms, 37 °C, and 10 km together.
avoid-lone-last-word = false # Keep a final English word with its predecessor when both fit.
stage = "after"
collapse-spaces = true
long-words = "overflow" # "break" allows grapheme-safe splitting of long plain words.
# prose-commands = ['mytext'] # Permit custom commands at prose line starts.
# text-commands = ['caption', 'footnote'] # Limit safe standard text parameters; [] disables them.
# break-chars = ['-'] # Width-triggered tight breaks retain TeX spacing using %.

[comments]
wrap = false # Reflow comments during prose wrapping. Bulleted and numbered items use hanging indents.
align-trailing = false # Align spaced end-of-line comments at the same indentation.

# Arguments expand only with an active width, or explicit mode = "expand".
# "wrap" and "rewrap" supply wrap.columns when columns is omitted.
[arguments]
mode = "auto"
split-commas = true
split-equals = false
align-consecutive = false # Align argument columns in adjacent standalone calls of the same command.
align-equals = true # Align assignments in multiline option lists.
listings-literate = true # Put each literal substitution rule on its own line.
# Standalone glossary declarations expand at columns (or wrap.columns).
# Hyphenation lists also expand at four words, font shapes at two font mappings.
graphics-paths = "auto" # Expand four or more directories, multiline lists or over-width lines. Also accepts "expand" or "preserve".
foreach-lists = "preserve" # "expand" uses one record per line; "auto" checks columns or wrap.columns.
# columns = 88
# [arguments.rules.customkeys]
# argument = 1 # Select the second mandatory brace group.
# columns = 60
# [arguments.rules.includegraphics]
# optional-argument = 0 # Keep selecting options when overriding the automatic rule.
# columns = 60

[sentences]
enabled = false
preserve-line-breaks = true
stage = "after"
indent = ""

[whitespace]
remove-trailing = true
before-processing = false
blank-lines = 2 # Maximum consecutive blank lines. Use 0 to remove them or "unlimited" to keep all.

[output]
line-ending = "preserve"
final-newline = "always"

[breaks]
enabled = true # Environment/loop boundaries, table rules and eligible captions receive lines.
# tikz-path-columns = 88 # Split long drawing paths before line segments, curves and nodes.
split-cmidrules = false # Keep same-row cmidrules together; enable to put each rule on its own line.
pgfplots-coordinates = false # Put each literal coordinate on its own line in addplot and addplot3.
pgfplots-tables = true # Align whitespace-separated inline addplot table records.
pgfplots-named-tables = true # Align existing rows in standalone pgfplotstableread declarations.

# Preserve selected boundaries instead of using the environment defaults:
# [breaks.rules.quote]
# body = "preserve"
# end = "preserve"

# Preserve recognized loop boundaries:
# [breaks.categories.loop]
# begin = "preserve"
# body = "preserve"
# end = "preserve"
# after = "preserve"

# Table rules inherit the containing environment's row policy.
# Preserve their boundaries independently:
# [breaks.categories.table-rule]
# begin = "preserve"
# after = "preserve"
# Override one complete rule:
# [breaks.rules.cmidrule]
# begin = "line"
# after = "line"

# Optional condition boundary changes:
# [breaks.categories.condition]
# else-begin = "line"
# else-after = "line"
# or-begin = "line"
# or-after = "line"

# Custom environment header: one optional argument followed by two mandatory ones.
# [syntax.environment-arguments.custom]
# optional-arguments = true
# arguments = 2

# Ordered mandatory / optional / mandatory header:
# [syntax.environment-arguments.mytable]
# signature = 'mom'

# Override a custom tcolorbox header with one optional and one mandatory parameter.
# Literal fixed-arity ordinary tcolorbox factories infer this signature automatically.
# [syntax.environment-arguments.custombox]
# optional-arguments = true
# arguments = 1

[syntax.commands.raw]
arguments = 1
optional-arguments = false
preserve-body = true

[syntax]
infer-list-environments = true
foreach = true # Set false to disable dedicated loop recognition.

[syntax.headings.section]
level = 3
indent = false

# Custom specials conservatively disable ordinary-text parameter wrapping.
# [[syntax.special]]
# name = "custom"
# begin = '<BEGIN>'
# end = '<END>'
# regex = false
# nested = true
# verbatim = true

# Algorithm branches return to their matching block's indentation.
# [[syntax.special]]
# name = 'algorithmIf'
# begin = '\If'
# end = '\EndIf'
# middle = ['\ElsIf', '\Else']
# nested = true

[bibtex]
separate-entries = true # Leave one blank line between regular bibliography entries.
compact-strings = false # Group short literal @string assignments within wrap.columns.
format-filecontents = true # Format supported payload file types in filecontents.
normalize = true # Normalize field assignments.
name-case = "preserve" # "lower" or "upper" selects uniform type and field spelling.
align-fields = true # Applied during normalization.
# name-list-columns = 88 # Put each author or editor on a separate line in long literal lists.
# related-columns = 64 # Expand an over-width literal list of related citation keys.
# keyword-columns = 88 # Wrap literal keywords at outer commas when the field exceeds this width.
# concat-columns = 88 # Wrap long BibTeX expressions before each top-level #.
value-delimiters = "preserve" # "preserve", "braces", or "quotes".
field-order = [] # Keep source order; ["canonical"], ["alphabetical"], or field names.
sort = false # Enable to order movable entry groups by citation key.
sort-by = ["key"] # For example ["author", "-year", "title", "key"].
case-sensitive = false

[bibtex.cleanup]
enabled = false
months = false
sentence-case-titles = false
remove-duplicate-fields = false
remove-empty-fields = false
merge-duplicate-entries = false
normalize-urls = false
escape-special-characters = false
generate-missing-keys = false
# max-authors = 8 # Omit to retain complete author lists.

[code]
algorithm2e = true # Expand braced control flow and separate algorithm2e statements.
expl3 = true # Format explicit or package-declared expl3 regions.

[math]
enabled = true # Set false to retain formula-internal spacing and line breaks.
spacing = true # Normalize formula whitespace independently of display wrapping.
wrap = "break" # break, preserve, or single-line; applies to single-formula displays.
# columns = 80 # Omit to inherit wrap.columns.
# break-priority = ["relation", "additive", "multiplicative", "binary"] # First choice first.

[trees]
mode = "preserve" # "expand" indents subtrees; "auto" expands trees exceeding the width.
forest = true
dirtree = true # Indent existing directory records by their explicit numeric level.
qtree = true
# columns = 80 # Omit to inherit wrap.columns.

[protect]
# Package raw environments and literal code factories receive protection.
# Physics delimited matrix arguments stay opaque to outer row/column scans.
expl3 = true
dynamic-catcodes = true
macro-bodies = true
format-macro-bodies = true
inactive-branches = true

[[replacements]]
find = 'TODO'
replace = 'TODO'
match = "literal"
stage = "before"
scope = "unprotected"
enabled = false

[[replacements]]
find = '(?<=\b)colour\b'
replace = 'color'
match = "enhanced" # Use "regex" for Rust regular expressions.
stage = "after"
scope = "unprotected"
count = 1
backtrack-limit = 1000000
enabled = false

[files]
exclude = ["generated/", "vendor/", "*.generated.tex"]

[[overrides]]
files = ["slides/**/*.tex"]

[overrides.indent]
width = 2

[overrides.wrap]
mode = "preserve"

[cache]
# Disable optional performance caches with false or CLI --no-cache.
enabled = true
